name: java

# The Java modules' unit tests plus a native-image smoke. The native half is the
# reason this workflow exists: a GraalVM image is a second runtime, and several
# classes of defect are invisible on the JVM. `CurrentCliCommand.resolve()` read
# java.home/sun.java.command/java.class.path, which a native image reports as
# null/absent/empty — so `claude web -d` threw an NPE in every published native
# build while the entire JVM suite stayed green. WebGatewayRecord then failed one
# step later, for the same reason in Jackson form. Neither could be caught by any
# test that only runs on a JVM, so the smoke compiles a real image and runs the
# command for real.
on:
  push:
    branches: [main]
    paths:
      - "claude-code-*/**"
      - "buildSrc/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "claude-code-*/**"
      - "buildSrc/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/java.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: everything a developer would run locally. No native toolchain, so
  # a red here is almost always a real logic failure.
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      # The webui bundle is a resource of claude-code-app: without pnpm the
      # buildWebui task skips and the packaging tests see an empty bundle.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Test
        run: |
          set -o pipefail
          ./gradlew test || {
            status=$?
            # Surface the full assertion messages: the CI log truncates them,
            # and a bare "AssertionFailedError at Foo.java:112" says nothing.
            for f in $(find . -path '*/build/test-results/test/*.xml' -newermt '-30 minutes'); do
              grep -q 'failure' "$f" && { echo "=== $f ==="; cat "$f"; }
            done
            exit $status
          }

  # Builds a real native image and exercises the subprocess-relaunch paths in it.
  # Slower by design (~10 min): this is the only place a native-only defect can
  # be seen before release.
  native-smoke:
    name: native smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM (JDK 25 + native-image)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          component: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "gradle"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: webui/pnpm-lock.yaml

      # Layer 3: Fail fast (~15s) if GraalVM's tracing agent observes any runtime
      # com.claudecode.* reflection access (e.g. a Jackson upgrade calling an
      # unregistered @JsonValue method) not covered by the reachability metadata.
      - name: Audit runtime reflection with GraalVM tracing agent
        run: |
          ./gradlew :claude-code-app:verifyNativeAgentMetadata

      # nativeQuickCompile is the -Ob developer flavour: same entry points and
      # same reflection metadata as the release image, a fraction of the build
      # time. The defects this job guards are behavioural, not optimization-level.
      - name: Build native image
        run: |
          ./gradlew :claude-code-app:nativeQuickCompile

      # Layer 4: Exercise the real native binary with realistic on-disk fixtures
      # (installed_plugins.json with PluginScope enums, model.json, settings.json)
      # across both `web -d` + Gateway HTTP endpoints and CLI non-interactive startup,
      # then assert zero MissingReflectionRegistrationError entries in the log.
      - name: Smoke the native binary with realistic fixtures
        shell: bash
        env:
          BIN: claude-code-app/build/native/nativeQuickCompile/poco
          # A fixed, run-scoped home rather than mktemp: the cleanup step below
          # runs as a separate shell, so it has to be able to name the same
          # directory to stop the gateway this step detaches.
          SMOKE_HOME: ${{ runner.temp }}/native-smoke
        run: |
          set -euo pipefail
          # An isolated config home keeps the smoke from touching a real one, and
          # makes "did this command actually publish?" unambiguous.
          HOME="$SMOKE_HOME"
          export HOME CLAUDE_CONFIG_DIR="$HOME/.claude"
          rm -rf "$HOME" /tmp/claude-code-java.log
          mkdir -p "$CLAUDE_CONFIG_DIR/plugins"
          cat > "$CLAUDE_CONFIG_DIR/plugins/installed_plugins.json" <<'EOF'
          {
            "version": 2,
            "plugins": {
              "smoke-plugin@official": [
                {
                  "scope": "user",
                  "installPath": "/tmp/nonexistent-smoke-plugin",
                  "version": "1.0.0",
                  "installedAt": "2026-01-01T00:00:00Z",
                  "lastUpdated": "2026-01-01T00:00:00Z"
                },
                {
                  "scope": "project",
                  "projectPath": "/tmp",
                  "installPath": "/tmp/nonexistent-smoke-plugin",
                  "version": "1.0.0"
                }
              ]
            }
          }
          EOF
          cat > "$CLAUDE_CONFIG_DIR/model.json" <<'EOF'
          {
            "version": 1,
            "models": [
              {
                "modelName": "smoke-model",
                "protocol": "anthropic",
                "baseUrl": "http://127.0.0.1:1",
                "apiKey": "smoke-key"
              }
            ]
          }
          EOF
          # The token is a live credential for a socket the runner is listening on.
          mask() { sed -E 's/(token=)[^ "&]*/\1<masked>/g'; }

          step() {
            local label="$1"; shift
            echo "::group::native smoke: $label"
            if ! "$BIN" "$@" 2>&1 | mask; then
              echo "native smoke failed at: $label"
              echo "::endgroup::"
              return 1
            fi
            echo "::endgroup::"
          }

          # Fails here (NPE / no record) if CurrentCliCommand cannot rebuild a
          # command that launches this binary.
          step "web -d" web -d
          # The gateway the previous step forked must be visible and alive.
          status="$("$BIN" web status 2>&1 | mask)"
          echo "$status"
          grep -qE "claude web is running" <<<"$status" \
            || { echo "web -d reported success but nothing is running:"; echo "$status"; exit 1; }

          # Exercise Gateway JSON serialization endpoints against the live native daemon.
          read -r base_url token < <(python3 - "$CLAUDE_CONFIG_DIR/web-gateway.json" <<'PY'
          import json, sys, urllib.parse
          url = json.load(open(sys.argv[1]))["url"]
          u = urllib.parse.urlsplit(url)
          tok = urllib.parse.parse_qs(u.query).get("token", [""])[0]
          print(f"{u.scheme}://{u.netloc}", tok)
          PY
          )
          for endpoint in /api/sessions /api/settings /api/models /api/projects; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "${base_url}${endpoint}")"
            echo "GET ${endpoint} -> HTTP ${code}"
            [ "$code" = "200" ] || { echo "Gateway endpoint ${endpoint} failed with HTTP ${code}"; exit 1; }
          done

          # Exercise --init-only so PluginRuntimeLoader -> InstalledPluginsStore.load()
          # actually deserializes installed_plugins.json inside the real native binary.
          step "--init-only (plugin + model fixture load)" --init-only

          # Verify zero native reflection errors in the runtime log.
          if [ -f /tmp/claude-code-java.log ] && grep -E "MissingReflectionRegistrationError|No serializer found" /tmp/claude-code-java.log; then
            echo "Native reflection error detected in /tmp/claude-code-java.log"
            exit 1
          fi

      # The gateway is detached by design, so it outlives the step that started
      # it. Stop it explicitly, or the runner keeps a bound port.
      - name: Stop the gateway
        if: always()
        shell: bash
        env:
          BIN: claude-code-app/build/native/nativeQuickCompile/poco
          SMOKE_HOME: ${{ runner.temp }}/native-smoke
        run: |
          HOME="$SMOKE_HOME" CLAUDE_CONFIG_DIR="$SMOKE_HOME/.claude" \
            "$BIN" web stop || true