# release.yml: configures `gh release create --generate-notes`. GitHub builds
# those notes from merged pull requests only — the sections below match PR
# *labels*, and commits pushed straight to a branch are never listed as
# entries. This repo has no pull requests, so every category here is inert:
# `releases/generate-notes` returns a bare Full Changelog line either way.
# Kept for a future PR-based flow, and because the changelog.exclude block
# still documents intent.
#
# (v0.2.0's categorized bullet list was not produced by this file — that
# release was created with a 22-byte Full Changelog body and rewritten an
# hour later by hand.)
changelog:
  exclude:
    labels:
      - ignore-for-release-notes
    authors:
      - dependabot
  categories:
    - title: 🚀 Features
      labels:
        - feat
    - title: 🐛 Bug Fixes
      labels:
        - fix
    - title: ⚡ Performance
      labels:
        - perf
    - title: 📚 Documentation
      labels:
        - docs
    - title: 🔧 CI & Tooling
      labels:
        - ci
        - chore
        - build
    - title: ♻️ Refactoring
      labels:
        - refactor
    - title: ✅ Tests
      labels:
        - test
